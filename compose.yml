version: '3.8'

services:
  user_management_service:
    build: 
      context: ./user_management_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=user_management_db
      - SECRET_KEY=your-secure-key-here
      - DEBUG=1
      - ALLOWED_HOSTS=localhost,127.0.0.1
    volumes:
      - ./user_management_service:/app
    command: bash -c "pip install werkzeug && python manage.py runserver 0.0.0.0:8000"

  core_service:
    build: ./core_service
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
      - user_management_service
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=core_service_db
      - SECRET_KEY=your-secure-key-here
      - DEBUG=1
      - ALLOWED_HOSTS=localhost,127.0.0.1
    volumes:
      - ./core_service:/app
    command: python manage.py runserver 0.0.0.0:8001

  mongodb:
    image: mongo:5.0
    environment: 
      - MONGO_INITDB_DATABASE=nigedease_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: