version: '3.8'

services:
  user_management_service:
    build: ./user_management_service
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/user_management_db
      - SECRET_KEY=django-insecure-development-key
      - DEBUG=1
    volumes:
      - ./user_management_service:/app

  core_service:
    build: ./core_service
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/core_db
      - SECRET_KEY=django-insecure-development-key
      - DEBUG=1
    volumes:
      - ./core_service:/app

  postgres:
    image: postgres:13 
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: