components:
  schemas:
    Company:
      properties:
        address:
          type: string
        created_at:
          format: date-time
          type: string
        email:
          type: string
        id:
          type: string
        name:
          type: string
        phone_number:
          type: string
        updated_at:
          format: date-time
          type: string
      type: object
    CompanyInput:
      properties:
        address:
          type: string
        email:
          type: string
        name:
          type: string
        phone_number:
          type: string
      required:
      - name
      type: object
    Inventory:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        product_id:
          type: string
        quantity:
          type: integer
        store_id:
          type: string
        updated_at:
          format: date-time
          type: string
      type: object
    Product:
      properties:
        category_id:
          type: string
        company_id:
          type: string
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        unit_id:
          type: string
        updated_at:
          format: date-time
          type: string
      type: object
info:
  description: API for testing MongoDB transition
  title: Nigedease MongoDB API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/companies:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Company'
                type: array
          description: List of companies
      summary: Get all companies
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: Company created
      summary: Create a new company
  /api/companies/{id}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: Company details
        '404':
          description: Company not found
      summary: Get company by ID
  /api/inventory:
    get:
      parameters:
      - in: query
        name: company_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Inventory'
                type: array
          description: List of inventory items
      summary: Get inventory for a company
  /api/products:
    get:
      parameters:
      - in: query
        name: company_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Product'
                type: array
          description: List of products
      summary: Get all products
servers:
- description: Development server
  url: http://localhost:5000
